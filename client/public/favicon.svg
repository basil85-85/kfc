<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer Dark Pitch Ring -->
  <circle cx="50" cy="50" r="49" fill="#041910" stroke="#10b981" stroke-width="2" />
  
  <!-- Base Football Sphere (White) -->
  <circle cx="50" cy="50" r="42" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" />
  
  <!-- Subtle 3D Surface Arc -->
  <path d="M 50 8 A 42 42 0 0 1 92 50 A 42 42 0 0 1 50 92 A 42 42 0 0 0 50 8 Z" fill="#CBD5E1" opacity="0.3" />

  <!-- Center Pentagon -->
  <polygon points="50,38 61,45 56,58 44,58 39,45" fill="#0F172A" />

  <!-- Top Pentagon & Seams -->
  <polygon points="50,11 60,19 56,30 44,30 40,19" fill="#0F172A" />
  <line x1="50" y1="38" x2="50" y2="30" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Right Pentagon & Seams -->
  <polygon points="80,30 87,41 78,51 68,46 70,34" fill="#0F172A" />
  <line x1="61" y1="45" x2="68" y2="46" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bottom Right Pentagon & Seams -->
  <polygon points="72,73 74,85 62,89 53,80 60,68" fill="#0F172A" />
  <line x1="56" y1="58" x2="60" y2="68" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bottom Left Pentagon & Seams -->
  <polygon points="28,73 40,68 47,80 38,89 26,85" fill="#0F172A" />
  <line x1="44" y1="58" x2="40" y2="68" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Pentagon & Seams -->
  <polygon points="20,30 30,34 32,46 22,51 13,41" fill="#0F172A" />
  <line x1="39" y1="45" x2="32" y2="46" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Outer Hexagon Seam Connections -->
  <line x1="40" y1="19" x2="30" y2="34" stroke="#0F172A" stroke-width="2" />
  <line x1="60" y1="19" x2="70" y2="34" stroke="#0F172A" stroke-width="2" />
  <line x1="78" y1="51" x2="72" y2="73" stroke="#0F172A" stroke-width="2" />
  <line x1="22" y1="51" x2="28" y2="73" stroke="#0F172A" stroke-width="2" />
</svg>
